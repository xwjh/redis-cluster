apiVersion: v1
kind: Secret
metadata:
  name: redis-acl-secret
  namespace: redis
  labels:
    app.kubernetes.io/name: redis-cluster
    app.kubernetes.io/managed-by: redis-operator
type: Opaque
# ACL 规则以明文写入，redis-operator 会挂载此 Secret 作为 ACL 配置文件
# 格式：每行一条 ACL 规则
stringData:
  # key 名必须是 user.acl，Operator 将其挂载为 /etc/redis/user.acl
  # redis.conf 中 aclfile 指令指向该路径
  user.acl: |
    user default on ~* &* +@all >123456
    user opstree on ~* &* +@all >abc@123
    user buildpiper on ~* &* +@all >abc@123
    user test on ~* &* +@all >abc@123
